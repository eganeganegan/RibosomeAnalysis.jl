name: test

on:
  push:
  pull_request:

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - name: Resolve dependencies for runner Julia
        run: |
          mv Manifest.toml Manifest.release.toml
          julia --project=. -e 'using Pkg; isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add(); Pkg.resolve(); Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - name: Process coverage
        if: matrix.julia-version == '1.10'
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage to Codecov
        if: matrix.julia-version == '1.10'
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: lcov.info
          use_oidc: true
      - name: Package load
        run: julia --project=. -e 'using RibosomeAnalysis'
      - name: Controlled examples
        run: |
          julia --project=. examples/structure_analysis.jl
          julia --project=. examples/binding_site_analysis.jl
          julia --project=. examples/trajectory_analysis.jl
          julia --project=. examples/comparison_analysis.jl

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/julia-format@v4
        with:
          version: '1'
          paths: 'src/, test/, scripts/, examples/, benchmarks/, validation/'
